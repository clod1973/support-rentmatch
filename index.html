<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent &amp; Buy Match</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --primary-green: #32D74B; /* Matches your app button */
            --text-main: #FFFFFF;
            --text-secondary: #A1A1A1;
            --link: #32D74B;
            --link-hover: #29b53f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            color: var(--link);
            text-decoration: none;
        }
        a:hover, a:focus {
            color: var(--link-hover);
            text-decoration: underline;
        }

        /* Header + Footer */
        .site-header, .site-footer {
            background: #0b0b0b;
            border-bottom: 1px solid #1e1e1e;
        }
        .site-footer {
            border-top: 1px solid #1e1e1e;
            border-bottom: none;
            margin-top: auto;
        }
        .nav-wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .brand {
            font-weight: 700;
            color: var(--primary-green);
        }
        .nav-links a {
            margin-left: 16px;
            font-size: 14px;
        }

        /* Main hero area */
        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px 40px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            background-color: var(--card-bg);
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
        }

        .icon-box {
            margin-bottom: 30px;
        }

        .icon-box svg {
            width: 80px;
            height: 80px;
            fill: var(--primary-green);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        p {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-green);
            color: #000000;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            transition: transform 0.2s ease, opacity 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .footer-note {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header with visible links to Home / Privacy / Terms -->
    <header class="site-header">
        <div class="nav-wrap">
            <div class="brand">Rent &amp; Buy Match</div>
            <nav class="nav-links" aria-label="Primary">
                <a href="https://www.rentandbuymatch.com/" aria-current="page">Home</a>
                <a href="https://www.rentandbuymatch.com/support/privacy">Privacy Policy</a>
                <a href="https://www.rentandbuymatch.com/support/terms">Terms of Service</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container" role="main">
            <div class="icon-box" aria-hidden="true">
                <!-- Simple House Icon matching your app theme -->
                <svg viewBox="0 0 24 24" focusable="false"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </div>

            <h1>Customer Support</h1>
            <p>Need assistance with Rent &amp; Buy Match? Our team is here to help you find your dream home.</p>

            <a href="mailto:support@rentandbuymatch.com" class="btn">Email Support</a>
        </div>
    </main>

    <!-- Footer with the same visible links -->
    <footer class="site-footer">
        <div class="nav-wrap">
            <div class="footer-note">
                &copy; 2026 Rent &amp; Buy Match Malta
            </div>
            <nav class="nav-links" aria-label="Footer">
                <a href="https://www.rentandbuymatch.com/" aria-current="page">Home</a>
                <a href="https://www.rentandbuymatch.com/support/privacy">Privacy Policy</a>
                <a href="https://www.rentandbuymatch.com/support/terms">Terms of Service</a>
            </nav>
        </div>
    </footer>

</body>
</html>
